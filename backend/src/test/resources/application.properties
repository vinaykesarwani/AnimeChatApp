spring.datasource.url=jdbc:h2:mem:chat-tests;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
jwt.secret=test-only-signing-key-with-at-least-thirty-two-bytes
jwt.expiration-ms=3600000
frontend.url=http://localhost:3000
spring.security.oauth2.client.registration.google.client-id=test-client
spring.security.oauth2.client.registration.google.client-secret=test-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.github.client-id=test-client
spring.security.oauth2.client.registration.github.client-secret=test-secret
logging.level.org.springframework.security=ERROR
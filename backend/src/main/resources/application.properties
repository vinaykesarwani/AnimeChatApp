# Load local properties from backend/ or the repository root.
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

spring.application.name=backend

# DATABASE CONFIGURATION

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
server.port=${PORT:8080}

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jackson.mapper.default-view-inclusion=true

# ── JWT ──────────────────────────────────────────────────────────────────────
# At least 32 UTF-8 bytes. The app.* fallback keeps older local profiles working.
jwt.secret=${JWT_SECRET:${app.jwt.secret}}
jwt.expiration-ms=${JWT_EXPIRATION_MS:${app.jwt.expiration-ms:86400000}}

# ── Frontend URL (for OAuth2 redirect) ───────────────────────────────────────
frontend.url=${FRONTEND_URL:${app.frontend-url:http://localhost:3000}}

# ── OAuth2: Google ────────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ── OAuth2: GitHub ────────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
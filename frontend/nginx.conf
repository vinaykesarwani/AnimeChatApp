# OAuth callbacks can contain tokens, so leave query strings out of access logs.
log_format frontend '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout frontend;

    # Let React handle page refreshes and OAuth callback routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
